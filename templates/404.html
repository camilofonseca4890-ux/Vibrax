{% extends "base.html" %}

{% block titulo %}Página no encontrada — Vibrax{% endblock %}

{% block contenido %}

<section class="seccion-destacada patron-topografico" style="min-height: 55vh; display: flex; flex-direction: column; justify-content: center;">
  <div class="icono-destacado">🧵</div>
  <h2 style="font-size: 2.6rem;">¡Se nos salió un hilo!</h2>
  <p style="margin-bottom: 28px;">
    No encontramos la página que buscas. Puede que el link esté mal escrito
    o que la página ya no exista.
  </p>
  <div>
    <a href="{{ url_for('index') }}" class="btn">Volver al inicio</a>
    <a href="{{ url_for('pedido') }}" class="btn btn-secundario" style="margin-left: 12px; border-color: var(--blanco); color: var(--blanco);">Hacer un pedido</a>
  </div>
</section>

{% endblock %}
